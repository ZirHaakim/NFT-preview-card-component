<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT Preview Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset.css" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="card">
      <div class="card-content">
        <img
          class="card-image"
          src="images/image-equilibrium.jpg"
          alt="Equilibrium NFT"
        />
        <section class="carddetail">
          <section class="cardheading">
            <div class="cardhead">
              <h1 class="Equilibrium">Equilibrium #3429</h1>

              <p class="description">
                Our Equilibrium collection promotes balance and calm.
              </p>
            </div>

            <div class="info">
              <div class="price">
                <img src="images/icon-ethereum.svg" alt="Ethereum" />
                <span>0.041 ETH</span>
              </div>

              <div class="time">
                <img src="images/icon-clock.svg" alt="Clock" />
                <span>3 days left</span>
              </div>
            </div>
          </section>

          <div class="hr"></div>
          <div class="creator">
            <img class="avatar" src="images/image-avatar.png" alt="Avatar" />
            <p><span>Creation of </span> Jules Wyvern</p>
          </div>
        </section>
      </div>
    </article>
  </body>
</html>
